name: Daily Streak Commit

on:
  schedule:
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two overlapping jobs cannot race the same append+push.
# Queued, not cancelled: a cancelled run can leave the day without an entry.
concurrency:
  group: daily-streak-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_AUTHOR_NAME: Radhika Saxena
  GIT_AUTHOR_EMAIL: radhikasaxen22@gmail.com
  GIT_COMMITTER_NAME: Radhika Saxena
  GIT_COMMITTER_EMAIL: radhikasaxen22@gmail.com

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Append daily entry
        id: entry
        run: |
          set -euo pipefail
          today="$(TZ=Etc/UTC date '+%Y-%m-%d')"
          stamp="$(TZ=Etc/UTC date '+%Y-%m-%d %H:%M')"
          if grep -qE "^- ${today} " streak-log.md 2>/dev/null; then
            echo "already logged for ${today}"
          else
            echo "- ${stamp} : automated daily contribution" >> streak-log.md
          fi
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add streak-log.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: automated daily contribution ${{ steps.entry.outputs.stamp }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
